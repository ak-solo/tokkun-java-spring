<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>社員編集</title>
</head>
<body>
<div layout:fragment="content">
    <h1>社員編集</h1>

    <form th:action="@{/employees/{id}/edit(id=${employee.id})}" method="post"
          th:object="${employee}">
        <input type="hidden" th:field="*{id}" />
        <div class="mb-3">
            <label class="form-label">氏名</label>
            <input type="text" th:field="*{name}" class="form-control" />
            <span th:errors="*{name}" class="text-danger small"></span>
        </div>
        <div class="mb-3">
            <label class="form-label">部署 ID</label>
            <input type="number" th:field="*{deptId}" class="form-control" />
        </div>
        <div class="mb-3">
            <label class="form-label">給与</label>
            <input type="number" th:field="*{salary}" class="form-control" />
            <span th:errors="*{salary}" class="text-danger small"></span>
        </div>
        <div class="mb-3">
            <label class="form-label">入社日</label>
            <input type="date" th:field="*{hireDate}" class="form-control" />
        </div>
        <button type="submit" class="btn btn-primary">更新</button>
        <a th:href="@{/employees/{id}(id=${employee.id})}" class="btn btn-secondary">キャンセル</a>
    </form>
</div>
</body>
</html>
