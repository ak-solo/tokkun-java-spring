<svg width="460" height="550" viewBox="0 0 460 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
    <marker id="arr-d" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#999"/>
    </marker>
  </defs>

  <!-- ブラウザ（上） -->
  <rect x="80" y="20" width="190" height="40" rx="20" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="175" y="40" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">ブラウザ</text>

  <!-- ブラウザ → Controller -->
  <line x1="175" y1="60" x2="175" y2="102" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="188" y="84" font-family="Arial, sans-serif" font-size="10" fill="#555">GET /employees</text>

  <!-- Controller -->
  <rect x="80" y="110" width="190" height="56" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="175" y="131" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Controller</text>
  <text x="175" y="151" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">URL を受け取り、処理の司令塔</text>

  <!-- Controller → Repository -->
  <line x1="175" y1="166" x2="175" y2="213" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="188" y="193" font-family="Arial, sans-serif" font-size="10" fill="#555">findAll() を呼ぶ</text>

  <!-- Repository -->
  <rect x="80" y="221" width="190" height="56" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="175" y="242" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Repository</text>
  <text x="175" y="261" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">JdbcTemplate で SQL を実行</text>

  <!-- Repository → DB -->
  <line x1="175" y1="277" x2="175" y2="324" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="188" y="304" font-family="Arial, sans-serif" font-size="10" fill="#555">SQL を実行</text>

  <!-- データベース -->
  <rect x="80" y="332" width="190" height="56" rx="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="175" y="353" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">データベース</text>
  <text x="175" y="371" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">（PostgreSQL）</text>

  <!-- DB → View（破線） -->
  <line x1="175" y1="388" x2="175" y2="427" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-d)"/>
  <text x="188" y="411" font-family="Arial, sans-serif" font-size="10" fill="#777">結果を返す</text>

  <!-- View -->
  <rect x="80" y="435" width="190" height="56" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="175" y="456" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">View</text>
  <text x="175" y="474" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">Thymeleaf で HTML を組み立てる</text>

  <!-- View → ブラウザ -->
  <line x1="175" y1="491" x2="175" y2="513" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="188" y="505" font-family="Arial, sans-serif" font-size="10" fill="#555">HTML</text>

  <!-- ブラウザ（下） -->
  <rect x="80" y="521" width="190" height="26" rx="13" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="175" y="534" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">ブラウザ（画面表示）</text>
</svg>
