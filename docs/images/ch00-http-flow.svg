<svg width="660" height="365" viewBox="0 0 660 365" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
    <marker id="arr-d" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#999"/>
    </marker>
  </defs>

  <!-- ブラウザ -->
  <rect x="20" y="18" width="150" height="50" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="95" y="39" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">ブラウザ</text>
  <text x="95" y="57" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">（クライアント）</text>

  <!-- サーバー -->
  <rect x="255" y="18" width="150" height="50" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="330" y="39" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">サーバー</text>
  <text x="330" y="57" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">（Spring Boot）</text>

  <!-- データベース -->
  <rect x="490" y="18" width="150" height="50" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="565" y="39" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">データベース</text>
  <text x="565" y="57" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">（PostgreSQL）</text>

  <!-- ライフライン -->
  <line x1="95" y1="68" x2="95" y2="355" stroke="#bbb" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="330" y1="68" x2="330" y2="355" stroke="#bbb" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="565" y1="68" x2="565" y2="355" stroke="#bbb" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ① ブラウザ → サーバー -->
  <line x1="95" y1="115" x2="322" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="212" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">① HTTP リクエスト</text>
  <text x="212" y="131" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">GET /employees</text>

  <!-- ② サーバー → データベース -->
  <line x1="330" y1="180" x2="557" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="447" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">② DB に問い合わせ</text>
  <text x="447" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">SELECT * FROM employees</text>

  <!-- データベース → サーバー（戻り、破線） -->
  <line x1="565" y1="235" x2="338" y2="235" stroke="#999" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-d)"/>
  <text x="447" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#777">結果（行データ）</text>

  <!-- ③ サーバー → ブラウザ -->
  <line x1="330" y1="290" x2="103" y2="290" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="212" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">③ HTTP レスポンス</text>
  <text x="212" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">HTML</text>

  <!-- ④ HTML を表示 -->
  <rect x="27" y="320" width="136" height="28" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2"/>
  <text x="95" y="334" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">④ HTML を表示</text>
</svg>
